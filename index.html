<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RETRO PIXEL MEDIA HUB & HLS PLAYER</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <!-- Retro Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- HLS.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- Clean Architecture CSS Imports -->
    <link rel="stylesheet" href="assets/css/design-system.css">
    <link rel="stylesheet" href="assets/css/layouts/desktop.css">
    <link rel="stylesheet" href="assets/css/layouts/mobile.css">

    <style>
        /* Core UI Component Wrappers */
        .breadcrumb-item {
            color: var(--accent-cyan);
            cursor: pointer;
            text-decoration: underline;
        }
        .breadcrumb-item:hover {
            color: var(--accent-pink);
        }
        .player-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .video-container {
            position: relative;
            aspect-ratio: 16/9;
            background-color: var(--player-bg);
            border: 2px solid var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.2);
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .explorer-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .grid-card:hover {
            border-color: var(--accent-cyan);
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--accent-glow);
        }
        .grid-card.active {
            border-color: var(--accent-pink);
            background: rgba(255, 0, 127, 0.1);
        }
        .grid-card.folder-card i {
            color: var(--accent-yellow);
        }
        .grid-card.media-card i {
            color: var(--accent-cyan);
        }
        .card-name {
            font-family: var(--pixel-font);
            word-break: break-word;
            line-height: 1.2;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="crt-overlay"></div>

    <!-- Retro Pixel Toast Notification -->
    <div id="pixelToast" style="display: none; position: fixed; top: 1.5rem; right: 1.5rem; z-index: 10000; background: var(--bg-surface); border: 2px solid var(--accent-pink); color: var(--text-main); font-family: var(--pixel-font); font-size: 0.8rem; padding: 0.6rem 1rem; box-shadow: 4px 4px 0px #000;">
        <i class="fa-solid fa-triangle-exclamation" style="color: var(--accent-pink); margin-right: 0.5rem;"></i>
        <span id="toastMsg">Notification message</span>
    </div>

    <div class="app-container">
        
        <!-- Header -->
        <header class="navbar">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
                <i class="fa-solid fa-gamepad" style="font-size: 1.8rem; color: var(--accent-cyan);"></i>
                <h1 class="brand-title">RETRO STREAM HUB</h1>
            </div>
        </header>

        <!-- Breadcrumb & Search Navigation Bar -->
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 0.5rem;">
            <div class="breadcrumb-bar" id="breadcrumbBar">
                <i class="fa-solid fa-folder-tree" style="color: var(--accent-yellow);"></i>
                <span class="breadcrumb-item" onclick="navigateToFolder('')">LIBRARY</span>
                <span id="breadcrumbPath"></span>
            </div>

            <!-- Retro Search Engine Input -->
            <div style="display: flex; align-items: center; gap: 0.4rem; background: var(--bg-surface); border: 2px solid var(--accent-purple); padding: 0.3rem 0.6rem; box-shadow: 3px 3px 0px #000;">
                <i class="fa-solid fa-magnifying-glass" style="color: var(--accent-cyan); font-size: 0.85rem;"></i>
                <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="CARI..." style="background: transparent; border: none; color: var(--text-main); font-family: var(--code-font); font-size: 0.85rem; outline: none; width: 220px;">
            </div>
        </div>

        <!-- Main Layout -->
        <main class="main-layout">
            
            <!-- Left: Folder Explorer Grid -->
            <section class="explorer-section">
                <div class="pixel-header-title" style="display: flex; justify-content: space-between; align-items: center;">
                    <span><i class="fa-solid fa-border-all"></i> DIRECTORY GRID EXPLORER</span>
                    <span id="itemCount" style="font-size: 0.75rem; color: var(--text-muted);">0 Items</span>
                </div>

                <div class="grid-explorer" id="gridExplorer">
                    <!-- Dynamic Folder & Media Cards rendered via JS module -->
                </div>
            </section>

            <!-- Right: Video Player (Hidden when idle) -->
            <aside class="player-wrapper" id="playerWrapper" style="display: none;">
                <div class="pixel-header-title">
                    <i class="fa-solid fa-tv"></i> SCREEN MONITOR
                </div>

                <div class="video-container">
                    <video id="hlsPlayer" controls poster=""></video>
                </div>

                <!-- Custom Retro Subtitle & Quality Control Bar -->
                <div style="display: flex; justify-content: space-between; align-items: center; gap: 0.4rem; background: var(--bg-surface); padding: 0.4rem 0.6rem; border: 2px solid var(--accent-purple); box-shadow: 3px 3px 0px #000; flex-wrap: nowrap;">
                    <button class="pixel-btn" id="btnToggleSub" onclick="toggleSubtitle()" style="font-size: 0.65rem; padding: 0.3rem 0.5rem; color: var(--text-muted); border-color: var(--text-dim); white-space: nowrap;">
                        <i class="fa-solid fa-closed-captioning"></i> SUBTITLE: OFF
                    </button>
                    
                    <!-- Retro Button Wrapper untuk Pemilih Resolusi -->
                    <div class="pixel-btn" style="font-size: 0.65rem; padding: 0.2rem 0.4rem; border-color: var(--accent-purple); color: var(--accent-cyan); display: inline-flex; align-items: center; gap: 0.3rem; white-space: nowrap;">
                        <i class="fa-solid fa-sliders" style="color: var(--accent-cyan); font-size: 0.75rem;"></i>
                        <select id="resSelect" onchange="changeResolution(this.value)" style="background: transparent; color: var(--accent-cyan); font-family: var(--pixel-font); font-size: 0.65rem; border: none; outline: none; cursor: pointer;">
                            <option value="-1" style="background: var(--bg-panel); color: var(--text-main);">Auto</option>
                        </select>
                    </div>
                </div>
            </aside>

        </main>

    </div>

    <!-- Clean Architecture JavaScript Modules -->
    <script src="assets/js/player.js"></script>
    <script src="assets/js/explorer.js"></script>
</body>
</html>
