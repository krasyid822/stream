name: HLS Queue - Dispatcher

# Dipanggil berkala (dan bisa manual). Tugasnya:
#   1. menyelaraskan status antrian dengan run pipeline yang ada;
#   2. memilih SATU release berikutnya;
#   3. commit status antrian;
#   4. menjalankan process-release-hls.yml untuk release tersebut.
#
# Hanya satu dispatcher yang boleh berjalan pada satu waktu. Pipeline utama
# tetap memakai concurrency group sendiri sebagai pengaman tambahan.

on:
  schedule:
    # Setiap 5 menit. GitHub bisa menunda cron saat beban tinggi.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "hls-queue-dispatcher"
  cancel-in-progress: false

jobs:
  dispatch:
    name: "Proses antrian"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout antrian
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: false

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Reconcile & simpan status antrian
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SAVED=0
          for attempt in 1 2 3 4 5; do
            echo "[i] Percobaan reconcile #${attempt}"
            git pull --rebase origin "${{ github.event.repository.default_branch }}" || true

            python3 .github/scripts/hls_queue.py reconcile

            if git diff --quiet -- .github/hls_queue.json; then
              echo "[i] Tidak ada perubahan status antrian."
              SAVED=1
              break
            fi

            git add .github/hls_queue.json
            git commit -m "chore(queue): reconcile dispatcher state [skip ci]"

            if git push origin "HEAD:${{ github.event.repository.default_branch }}"; then
              echo "[✓] Status antrian tersimpan."
              SAVED=1
              break
            fi

            echo "[!] Push ditolak; tarik perubahan terbaru lalu ulangi."
            git reset --hard HEAD~1
            sleep 3
          done

          if [ "$SAVED" != "1" ]; then
            echo "::error::Gagal menyimpan status antrian setelah beberapa percobaan."
            exit 1
          fi

          NEXT=$(cat .github/hls_queue_next.txt 2>/dev/null | tr -d '\r\n' || true)
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"
          if [ -n "$NEXT" ]; then
            echo "### ▶️ Release berikutnya: \`${NEXT}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⏸️ Tidak ada release yang perlu dijalankan." >> "$GITHUB_STEP_SUMMARY"
          fi
        id: reconcile

      - name: Dispatch pipeline
        if: steps.reconcile.outputs.next != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TAG: ${{ steps.reconcile.outputs.next }}
        run: |
          set -euo pipefail
          echo "[→] Menjalankan pipeline untuk ${NEXT_TAG}"
          gh workflow run process-release-hls.yml \
            --ref "${{ github.event.repository.default_branch }}" \
            -f "release_tag=${NEXT_TAG}"
