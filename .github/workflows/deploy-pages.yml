name: Deploy GitHub Pages Web UI Only

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Lightweight Web UI Artifact
        run: |
          mkdir -p site_dist
          # Copy hanya file Web UI ringan & metadata
          cp -r index.html favicon.ico assets aliases.json metadata.json site_dist/
          echo "Lightweight Web UI size:"
          du -sh site_dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Web UI Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site_dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
