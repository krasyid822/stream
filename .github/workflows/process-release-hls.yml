name: Process Release Archive & Auto HLS Stream Pipeline

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag GitHub Release yang ingin diproses secara manual'
        required: true
        default: ''

permissions:
  contents: write

concurrency:
  group: "hls-release-processing"
  cancel-in-progress: false

jobs:
  process-archive-hls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository (Instant Sparse Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
            assets
            aliases.json
            metadata.json
            generate_hls.py
            process_release_archive.py
            git_smart_push.py
            git_smart_pull.py
            push.sh
            pull.sh
            hls.sh
            run.sh
            README.md
            index.html
            favicon.ico
            .gitignore
          sparse-checkout-cone-mode: false

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pre-Check Existing HLS & Update Aliases
        id: precheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.release_tag }}"
          cat << 'EOF' > release_body.txt
          ${{ github.event.release.body }}
          EOF

          set +e
          python3 -u process_release_archive.py --check-skip "$TAG" release_body.txt
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 100 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "[⚡] Rilis '$TAG' sudah pernah diproses di stream_drive. Melewati instalasi dependency, download & transcode."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Cache APT Packages
        if: steps.precheck.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-cache-${{ runner.os }}-ffmpeg-extractors-v1
          restore-keys: |
            apt-cache-${{ runner.os }}-ffmpeg-extractors-

      - name: Install System Dependencies (FFmpeg & Extractors)
        if: steps.precheck.outputs.skip != 'true'
        run: |
          # Periksa apakah tool utama sudah terpasang di runner Ubuntu (FFmpeg & 7z bawaan sudah ada)
          sudo apt update -qq
          sudo apt install -y --no-install-recommends ffmpeg p7zip-full p7zip-rar unrar zpaq unshield

      - name: Download Release Assets
        if: steps.precheck.outputs.skip != 'true'
        id: download_assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release_downloads
          TAG="${{ github.event.release.tag_name || github.event.inputs.release_tag }}"
          echo "Processing Release Tag: $TAG"
          gh release download "$TAG" --dir release_downloads --clobber || true
          ls -lh release_downloads/

      - name: Extract Archive & Generate HLS Pipeline
        if: steps.precheck.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.release_tag }}"
          python3 -u process_release_archive.py release_downloads "$TAG" release_body.txt

      - name: Push Metadata Updates to stream (Web UI)
        run: |
          chmod +x push.sh git_smart_push.py
          git add aliases.json metadata.json || true
          if [ -n "$(git status --porcelain aliases.json metadata.json)" ]; then
            git commit -m "chore(metadata): update library index & aliases [skip ci]" || true
            git push origin main || true
          fi

      - name: Push New HLS Media to stream_drive
        if: steps.precheck.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.DRIVE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # 1. Clone shallow repo stream_drive secara instan
          mkdir -p stream_drive_target
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/krasyid822/stream_drive.git" stream_drive_target

          # 2. Pindahkan folder konten media yang baru dari workspace ke stream_drive_target
          echo "Memindahkan folder media ke stream_drive_target..."
          HAS_MEDIA=false
          for dir in */ ; do
            dname="${dir%/}"
            if [ "$dname" != "assets" ] && [ "$dname" != ".github" ] && [ "$dname" != "release_downloads" ] && [ "$dname" != "RAW_TEMP" ] && [ "$dname" != "RAW" ] && [ "$dname" != "stream_drive_target" ]; then
              echo "Memindahkan folder: $dname ke stream_drive..."
              cp -r "$dname" stream_drive_target/
              HAS_MEDIA=true
            fi
          done

          # 3. Jalankan smart push hanya jika ada media baru
          if [ "$HAS_MEDIA" = true ]; then
            cd stream_drive_target
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            python3 -u ../git_smart_push.py
          else
            echo "[+] Tidak ada folder media baru yang perlu di-push ke stream_drive."
          fi

      - name: Clean Up Workspace
        if: always()
        run: |
          rm -rf release_downloads release_body.txt RAW_TEMP RAW RAW_TEMP_EXTRACT stream_drive_target
