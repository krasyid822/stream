name: Process Release Archive & Auto HLS Stream Pipeline

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag GitHub Release yang ingin diproses secara manual'
        required: true
        default: ''
      sync_only:
        description: 'Hanya sinkronkan metadata.json dari stream_drive (lewati download/encode/push media)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Konfigurasi pipeline (dapat diubah lewat repository variables:
# Settings > Secrets and variables > Actions > Variables > New repository variable)
# Tidak perlu diisi di form — semua nilai dihitung otomatis dari ukuran arsip.
env:
  # Target ukuran arsip per shard encode (GB). Makin kecil = makin banyak job paralel.
  HLS_CHUNK_SIZE_GB: ${{ vars.HLS_CHUNK_SIZE_GB || '1.2' }}
  # Batas maksimum shard per grup arsip
  HLS_MAX_SHARDS: ${{ vars.HLS_MAX_SHARDS || '6' }}

concurrency:
  group: "hls-release-processing"
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # 0. SYNC METADATA SAJA — rebuild metadata.json dari isi stream_drive
  #    Dipakai saat media sudah ada di stream_drive tapi metadata.json basi.
  # ==========================================================================
  sync-metadata:
    name: "0) Sinkron Metadata (saja)"
    if: inputs.sync_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code Repository (Instant Sparse Checkout)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          sparse-checkout: |
            .github
            aliases.json
            metadata.json
            process_release_archive.py
            generate_hls.py
          sparse-checkout-cone-mode: false

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sinkronkan metadata.json dari stream_drive
        env:
          GH_TOKEN: ${{ secrets.DRIVE_PAT || secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python3 -u process_release_archive.py --sync-metadata

      - name: Push Metadata Updates to stream (Web UI)
        run: |
          git add metadata.json aliases.json || true
          if [ -n "$(git status --porcelain metadata.json aliases.json)" ]; then
            git commit -m "chore(metadata): sync library index from stream_drive [skip ci]" || true
            git push origin HEAD:main || true
            echo "[✓] metadata.json berhasil diperbarui & di-push."
          else
            echo "[i] metadata.json sudah paling baru, tidak ada yang di-push."
          fi

      - name: Ringkasan Hasil Sinkron
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          p = "metadata.json"
          if not os.path.exists(p):
              print("### Sinkron Metadata\n\nmetadata.json tidak ditemukan.")
              raise SystemExit(0)
          d = json.load(open(p))
          cats = d.get("categories", [])
          media = d.get("media", [])
          print("## 🗂️ Sinkron Metadata dari stream_drive\n")
          print(f"- Total media: **{len(media)}**\n- Kategori: **{', '.join(cats) or '-'}**\n")
          from collections import Counter
          c = Counter(m.get("folder", "").split("/")[0] for m in media)
          print("| Kategori | Jumlah |\n|---|---|")
          for k, v in sorted(c.items()):
              print(f"| {k} | {v} |")
          print("\n<details><summary>Daftar episode</summary>\n")
          for m in media:
              print(f"- `{m['path']}`")
          print("\n</details>")
          PY

  # ==========================================================================
  # 1. PLAN — menyusun manifest chunk encode (tidak mengunduh file apa pun)
  # ==========================================================================
  plan:
    name: "1) Plan Chunk"
    if: inputs.sync_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      chunks_count: ${{ steps.plan.outputs.chunks_count }}
      chunks: ${{ steps.plan.outputs.chunks }}
    steps:
      - name: Checkout Code Repository (Instant Sparse Checkout)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          sparse-checkout: |
            .github
            assets
            aliases.json
            metadata.json
            generate_hls.py
            process_release_archive.py
            git_smart_push.py
            git_smart_pull.py
            push.sh
            pull.sh
            hls.sh
            run.sh
            README.md
            index.html
            favicon.ico
            .gitignore
          sparse-checkout-cone-mode: false

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build Chunk Plan
        id: plan
        env:
          GH_TOKEN: ${{ secrets.DRIVE_PAT || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
        run: |
          cat << 'EOF' > release_body.txt
          ${{ github.event.release.body }}
          EOF

          python3 -u process_release_archive.py --plan release_body.txt plan.json

      - name: Commit Updated Aliases (Web UI)
        if: steps.plan.outputs.skip != 'true'
        run: |
          git add aliases.json || true
          if [ -n "$(git status --porcelain aliases.json)" ]; then
            git commit -m "chore(metadata): update aliases & sources [skip ci]" || true
            git push origin HEAD:main || true
          fi

  # ==========================================================================
  # 2. ENCODE — matrix: tiap job mengunduh arsipnya sendiri & memproses 1 shard
  # ==========================================================================
  encode:
    name: "2) Encode ${{ matrix.chunk.id }}"
    needs: plan
    if: inputs.sync_only != true && needs.plan.outputs.skip != 'true' && needs.plan.outputs.chunks_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - name: Checkout Code Repository (Instant Sparse Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
            assets
            aliases.json
            metadata.json
            generate_hls.py
            process_release_archive.py
            git_smart_push.py
            git_smart_pull.py
            push.sh
            pull.sh
            hls.sh
            run.sh
            README.md
            index.html
            favicon.ico
            .gitignore
          sparse-checkout-cone-mode: false

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache APT Packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-cache-${{ runner.os }}-ffmpeg-extractors-v1
          restore-keys: |
            apt-cache-${{ runner.os }}-ffmpeg-extractors-

      - name: Install System Dependencies (FFmpeg & Extractors)
        run: |
          sudo apt update -qq
          sudo apt install -y --no-install-recommends ffmpeg p7zip-full p7zip-rar unrar zpaq unshield

      - name: Download, Extract & Encode Chunk
        env:
          GH_TOKEN: ${{ secrets.DRIVE_PAT || secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
          CHUNK_JSON: ${{ toJSON(matrix.chunk) }}
          # Konfigurasi encode (bisa diubah lewat repository variables)
          HLS_NATIVE_MODE: ${{ vars.HLS_NATIVE_MODE || 'auto' }}
          HLS_NATIVE_PRESET: ${{ vars.HLS_NATIVE_PRESET || 'medium' }}
          HLS_DERIVED_PRESET: ${{ vars.HLS_DERIVED_PRESET || 'veryfast' }}
        run: |
          cat << 'EOF' > release_body.txt
          ${{ github.event.release.body }}
          EOF

          echo "$CHUNK_JSON" > chunk.json
          python3 -u process_release_archive.py --encode-chunk release_body.txt chunk.json

      - name: Upload HLS Output (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hls_${{ matrix.chunk.id }}
          path: HLS_OUT
          retention-days: 1
          compression-level: 1
          if-no-files-found: ignore

  # ==========================================================================
  # 3. PUBLISH — gabungkan semua hasil encode & push ke stream_drive
  # ==========================================================================
  publish:
    name: "3) Publish ke stream_drive"
    needs: [plan, encode]
    if: always() && inputs.sync_only != true && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Code Repository (Instant Sparse Checkout)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          sparse-checkout: |
            .github
            assets
            aliases.json
            metadata.json
            generate_hls.py
            process_release_archive.py
            git_smart_push.py
            git_smart_pull.py
            push.sh
            pull.sh
            hls.sh
            run.sh
            README.md
            index.html
            favicon.ico
            .gitignore
          sparse-checkout-cone-mode: false

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download All HLS Artifacts
        if: needs.encode.result != 'skipped' && needs.encode.result != 'cancelled'
        uses: actions/download-artifact@v4
        with:
          pattern: hls_*
          path: hls_artifacts
          merge-multiple: false

      - name: Measure Artifact Size (untuk timeout dinamis)
        id: measure
        run: |
          MB=0
          if [ -d hls_artifacts ]; then
            MB=$(du -sm hls_artifacts | cut -f1)
          fi
          # Asumsi konservatif ~400 MB/menit untuk upload git + overhead git add/commit
          MIN=$(( MB / 400 + 30 ))
          [ "$MIN" -lt 60 ] && MIN=60
          [ "$MIN" -gt 330 ] && MIN=330
          echo "Total artifact HLS: ${MB} MB -> timeout push: ${MIN} menit"
          echo "push_minutes=${MIN}" >> "$GITHUB_OUTPUT"

      - name: Push New HLS Media to stream_drive
        if: needs.encode.result != 'skipped' && needs.encode.result != 'cancelled'
        shell: bash
        timeout-minutes: ${{ fromJSON(steps.measure.outputs.push_minutes) }}
        env:
          GH_TOKEN: ${{ secrets.DRIVE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if [ -d hls_artifacts ] && [ -n "$(ls -A hls_artifacts 2>/dev/null)" ]; then
            # 1. Clone RINGKAS: blobless + sparse TANPA file .ts
            #    Repo stream_drive sudah ~15 GB / 19.000+ file .ts, sedangkan file .ts lama
            #    tidak pernah diubah (hanya ditambahkan) -> tidak perlu diunduh sama sekali.
            #    Yang di-materialisasi hanya playlist/subtitle/poster (ratusan file kecil).
            git clone --filter=blob:none --no-checkout --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/krasyid822/stream_drive.git" stream_drive_target
            cd stream_drive_target
            git sparse-checkout init --no-cone
            git sparse-checkout set "/*" "!*.ts"
            git read-tree -mu HEAD
            cd ..

            echo "Ukuran working tree stream_drive: $(du -sh stream_drive_target | cut -f1) (repo aslinya ~15 GB)"
            echo "Disk sebelum merge:"
            df -h . | tail -1

            PUSH_OK=0
            PUSH_FAIL=0
            for art in hls_artifacts/hls_*/ ; do
              [ -d "$art" ] || continue
              ART_NAME="$(basename "$art")"
              HAS_MEDIA=false

              while IFS= read -r -d '' topdir; do
                echo "  [${ART_NAME}] Merging: $(basename "$topdir")"
                cp -r "$topdir" stream_drive_target/
                HAS_MEDIA=true
              done < <(find "$art" -mindepth 1 -maxdepth 1 -type d -print0)

              # Sudah tersalin ke working tree -> artifact tidak lagi dibutuhkan (hemat disk)
              rm -rf "$art"

              if [ "$HAS_MEDIA" = true ]; then
                echo "  [${ART_NAME}] Mendorong ke stream_drive..."
                if ( cd stream_drive_target && python3 -u ../git_smart_push.py ); then
                  PUSH_OK=$((PUSH_OK + 1))
                else
                  PUSH_FAIL=$((PUSH_FAIL + 1))
                  echo "  [${ART_NAME}] Push gagal. File tetap ada di working tree & akan dicoba lagi di batch berikutnya."
                fi
              else
                echo "  [${ART_NAME}] Tidak ada folder media di artifact ini."
              fi
            done

            echo "Ringkasan push: ${PUSH_OK} batch sukses, ${PUSH_FAIL} batch gagal."
            echo "Disk sesudah merge:"
            df -h . | tail -1

            if [ "$PUSH_FAIL" -gt 0 ]; then
              echo "::error::${PUSH_FAIL} batch artifact gagal di-push ke stream_drive."
              exit 1
            fi
          else
            echo "[i] Tidak ada artifact HLS untuk dipush (semua episode sudah ada?)."
          fi

      - name: Sync Metadata from stream_drive
        if: needs.encode.result != 'skipped' && needs.encode.result != 'cancelled'
        env:
          GH_TOKEN: ${{ secrets.DRIVE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python3 -u process_release_archive.py --sync-metadata

      - name: Push Metadata Updates to stream (Web UI)
        if: always()
        run: |
          git add metadata.json aliases.json || true
          if [ -n "$(git status --porcelain metadata.json aliases.json)" ]; then
            git commit -m "chore(metadata): update library index & aliases [skip ci]" || true
            git push origin HEAD:main || true
          fi

      - name: Report Failed Chunks
        if: needs.encode.result == 'failure' || needs.encode.result == 'cancelled'
        run: |
          echo "::error::Sebagian shard encode gagal (status: ${{ needs.encode.result }}). Hasil parsial tetap dipublish. Jalankan ulang workflow ini — episode yang sudah jadi akan otomatis dilewati (resume)."
          exit 1