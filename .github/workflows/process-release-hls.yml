name: Process Release Archive & Auto HLS Stream Pipeline

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag GitHub Release yang ingin diproses secara manual'
        required: true
        default: ''

permissions:
  contents: write

concurrency:
  group: "hls-release-processing"
  cancel-in-progress: false

jobs:
  process-archive-hls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository (Instant Sparse Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
            assets
            aliases.json
            metadata.json
            generate_hls.py
            process_release_archive.py
            git_smart_push.py
            git_smart_pull.py
            push.sh
            pull.sh
            hls.sh
            run.sh
            README.md
            index.html
            favicon.ico
            .gitignore
          sparse-checkout-cone-mode: false

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Archive Extractors)
        run: |
          sudo apt update
          sudo apt install -y ffmpeg p7zip-full p7zip-rar unrar zpaq unshield

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download Release Assets
        id: download_assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release_downloads
          TAG="${{ github.event.release.tag_name || github.event.inputs.release_tag }}"
          echo "Processing Release Tag: $TAG"
          
          cat << 'EOF' > release_body.txt
          ${{ github.event.release.body }}
          EOF

          gh release download "$TAG" --dir release_downloads --clobber || true
          ls -lh release_downloads/

      - name: Extract Archive & Generate HLS Pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.release_tag }}"
          python3 -u process_release_archive.py release_downloads "$TAG" release_body.txt

      - name: Checkout Target stream_drive
        uses: actions/checkout@v4
        with:
          repository: krasyid822/stream_drive
          token: ${{ secrets.DRIVE_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          path: stream_drive_target

      - name: Push HLS Media to stream_drive & Metadata to stream
        env:
          GH_TOKEN: ${{ secrets.DRIVE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x push.sh git_smart_push.py
          
          # 1. Commit & Push update metadata dan aliases ke repo stream (Web UI)
          git add aliases.json metadata.json || true
          if [ -n "$(git status --porcelain aliases.json metadata.json)" ]; then
            git commit -m "chore(metadata): update library index & aliases [skip ci]" || true
            git push origin main || true
          fi

          # 2. Pindahkan folder konten media dari workspace ke stream_drive_target
          echo "Memindahkan folder media ke stream_drive_target..."
          for dir in */ ; do
            dname="${dir%/}"
            if [ "$dname" != "assets" ] && [ "$dname" != ".github" ] && [ "$dname" != "release_downloads" ] && [ "$dname" != "RAW_TEMP" ] && [ "$dname" != "RAW" ] && [ "$dname" != "stream_drive_target" ]; then
              echo "Memindahkan folder: $dname ke stream_drive..."
              cp -r "$dname" stream_drive_target/
            fi
          done

          # 3. Jalankan smart push di dalam stream_drive_target
          cd stream_drive_target
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/krasyid822/stream_drive.git"
          
          python3 -u ../git_smart_push.py

      - name: Clean Up Workspace
        if: always()
        run: |
          rm -rf release_downloads release_body.txt RAW_TEMP RAW RAW_TEMP_EXTRACT ../stream_drive_clone
