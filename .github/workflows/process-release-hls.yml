name: Process Release Archive & Auto HLS Stream Pipeline

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag GitHub Release yang ingin diproses secara manual'
        required: true
        default: ''

permissions:
  contents: write

concurrency:
  group: "hls-release-processing"
  cancel-in-progress: false

jobs:
  process-archive-hls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository (Bare / Shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Archive Extractors)
        run: |
          sudo apt update
          sudo apt install -y ffmpeg p7zip-full p7zip-rar unrar zpaq unshield

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download Release Assets
        id: download_assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release_downloads
          TAG="${{ github.event.release.tag_name || github.event.inputs.release_tag }}"
          echo "Processing Release Tag: $TAG"
          
          cat << 'EOF' > release_body.txt
          ${{ github.event.release.body }}
          EOF

          gh release download "$TAG" --dir release_downloads --clobber || true
          ls -lh release_downloads/

      - name: Extract Archive & Generate HLS Pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.release_tag }}"
          python3 process_release_archive.py release_downloads "$TAG" release_body.txt

      - name: Auto Chunk Push HLS Segments to Repository
        run: |
          chmod +x push.sh git_smart_push.py
          ./push.sh

      - name: Clean Up Workspace
        if: always()
        run: |
          rm -rf release_downloads release_body.txt RAW_TEMP_EXTRACT
